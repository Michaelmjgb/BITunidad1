<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Ferretería La Popular</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <div class="admin-header d-flex justify-content-between align-items-center">
            <h1><i class="fas fa-tools"></i> Panel de Administración</h1>
            <a href="index.html" class="btn btn-danger">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </a>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Agregar Nuevo Producto</h5>
                        
                        <!-- Formulario para agregar productos -->
                        <form id="addProductForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <input type="text" name="nombre" class="form-control" placeholder="Nombre" required>
                            </div>
                            <div class="mb-3">
                                <input type="number" name="precio" class="form-control" placeholder="Precio" step="0.01" required>
                            </div>
                            <div class="mb-3">
                                <select name="categoria" class="form-select">
                                    <option value="Herramientas manuales">Herramientas manuales</option>
                                    <option value="Herramientas eléctricas">Herramientas eléctricas</option>
                                    <option value="Materiales de construcción">Materiales de construcción</option>
                                    <!-- Añadir -->
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="imagen" class="form-label">Imagen del producto:</label>
                                <input type="file" name="imagen" id="imagen" class="form-control" accept="image/*" onchange="mostrarVistaPrevia(this)" required>
                                <div id="vistaPrevia" class="mt-2 text-center"></div>
                            </div>
                            <button type="submit" class="btn btn-primary">Agregar</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Lista de Productos</h5>
                        <div id="productList">
                            
                            <!-- se cargarán los productos  -->
                            <p class="text-muted">No hay productos registrados.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    function mostrarVistaPrevia(input) {
        const vistaPrevia = document.getElementById('vistaPrevia');
        vistaPrevia.innerHTML = '';
        
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                vistaPrevia.innerHTML = `<img src="${e.target.result}" class="img-fluid">`;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }
    </script>

    <!-- JavaScript -->
    <script src="auth.js"></script>
    <script src="admin.js"></script>
    <script src="productos.js"></script>
</body>
</html>
