<body>
    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Ferretería La Popular</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        
    </nav>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-dark text-white py-3">
                        <h2 class="mb-0 text-center text-warning">Registro de Cliente</h2>
                    </div>
                
                    <div class="card-body p-5">
                        <a href="index.html" class="btn btn-outline-dark btn-volver">
                            <i class="bi bi-arrow-left me-2"></i> Volver
                        </a>
                        <form id="registroForm">
                            <div class="row mb-4">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label for="nombre" class="form-label fw-bold">Nombre y apellido</label>
                                    <input type="text" class="form-control" id="nombre" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="correo" class="form-label fw-bold">Correo electrónico</label>
                                    <input type="email" class="form-control" id="correo" required>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label for="telefono" class="form-label fw-bold">Teléfono / Celular</label>
                                    <input type="tel" class="form-control" id="telefono" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="ciudad" class="form-label fw-bold">Ciudad</label>
                                    <input type="text" class="form-control" id="ciudad" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="asunto" class="form-label fw-bold">Asunto</label>
                                <select class="form-select" id="asunto" required>
                                    <option value="" selected disabled>Seleccione un asunto</option>
                                    <option value="registro">Registro de cliente</option>
                                    <option value="consulta">Consulta general</option>
                                    <option value="cotizacion">Solicitud de cotización</option>
                                    <option value="otros">Otros</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="mensaje" class="form-label fw-bold">Mensaje</label>
                                <textarea class="form-control" id="mensaje" rows="4" required></textarea>
                            </div>

                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="politica" required>
                                <label class="form-check-label" for="politica">Acepta política y tratamiento de datos</label>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-warning btn-lg fw-bold py-3">
                                    <i class="bi bi-person-plus-fill me-2"></i> ENVIAR REGISTRO
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    
    <footer class="bg-dark text-white pt-5 pb-4">
        
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
</body>
</html>
